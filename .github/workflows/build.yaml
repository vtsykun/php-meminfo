name: Build and test the extension

on: push

jobs:
  # PIE builds a tag without --with-meminfo-version, so the version it reports
  # is extension/VERSION: a release tag has to match it.
  release-version:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check that extension/VERSION matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(tr -d ' \r\n' < extension/VERSION)"
          echo "tag: $GITHUB_REF_NAME, extension/VERSION: $version"
          if [ "$tag" != "$version" ]; then
            echo "::error file=extension/VERSION::extension/VERSION is '$version' but the tag is '$GITHUB_REF_NAME': bump extension/VERSION to '$tag' and tag again"
            exit 1
          fi
          echo "extension/VERSION matches the tag"

  oom-engines:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [legacy-runtime, backport-runtime, fpm-runtime]
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned OOM engine and verify its native behavior
        run: |
          docker build --build-arg RUNTIME=${{ matrix.runtime }} \
            -f tools/repro/oom-hooks/Dockerfile -t meminfo-oom:${{ matrix.runtime }} .
      - name: Test fatal-time and early capture contracts
        shell: bash
        run: |
          docker run --name meminfo-oom-tests -e MEMINFO_TEST_KEEP_CHILD_OUTPUT=1 \
            meminfo-oom:${{ matrix.runtime }} sh -c '
              set -eu
              cat oom-engine.json
              REPORT_EXIT_STATUS=1 NO_INTERACTION=1 php run-tests.php -n \
                -d extension=/src/extension/modules/meminfo.so \
                tests/dump-bailout_mid_walk.phpt tests/dump-on_limit.phpt tests/dump-on_threshold*.phpt > run-tests.log 2>&1 || {
                  cat run-tests.log; exit 1;
                }
              cat run-tests.log
              grep -E "PASS.*\[tests/dump-on_threshold_jit.phpt\]" run-tests.log
              grep -E "PASS.*\[tests/dump-on_threshold_cleanup.phpt\]" run-tests.log
              if [ -n "${MEMINFO_FPM_BINARY:-}" ]; then
                php -n /src/tools/repro/oom-hooks/fpm.php
              fi
            '
      - name: Collect OOM provenance and diagnostics
        if: always()
        run: |
          mkdir -p oom-artifacts
          docker cp meminfo-oom-tests:/src/extension/oom-engine.json oom-artifacts/ || true
          docker cp meminfo-oom-tests:/src/extension/run-tests.log oom-artifacts/ || true
          docker cp meminfo-oom-tests:/src/extension/tests oom-artifacts/tests || true
          docker cp meminfo-oom-tests:/tmp oom-artifacts/children || true
          docker rm -f meminfo-oom-tests || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oom-${{ matrix.runtime }}
          path: oom-artifacts/

  build:
    runs-on: ${{ matrix.os }}
    env:
      MEMINFO_TEST_KEEP_CHILD_OUTPUT: '1'
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        sigqueue: ['yes']
        os: ['ubuntu-22.04']
        # An include that differs only in ts adds a job instead of changing one.
        ts: ['nts']
        include:
          # Built as if sigqueue() did not exist, which is the macOS situation:
          # the target names its dump after its pid and the trigger has to find it.
          - php-versions: '8.1'
            sigqueue: 'no'
            os: 'ubuntu-22.04'
          # The real thing: no sigqueue(), no /proc; process facts come from sysctl.
          - php-versions: '8.1'
            sigqueue: 'yes'
            os: 'macos-latest'
          # A thread-safe build, which composer.json declares to PIE
          # (support-zts). The signal path is NTS-only and skips there.
          - php-versions: '8.4'
            sigqueue: 'yes'
            os: 'ubuntu-22.04'
            ts: 'zts'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ext-protobuf, so bug-protobuf_null_properties.phpt runs instead of skipping.
      # Each PECL line supports only some PHP versions: pick the newest that builds.
      # On macOS a PECL build fails; the unversioned name gets setup-php's Homebrew bottle.
      - name: Pick the ext-protobuf version
        id: protobuf
        run: |
          case "${{ matrix.php-versions }}" in
            7.*) version=3.24.4 ;;
            8.0) version=3.25.3 ;;
            8.1) version=4.33.6 ;;
            *)   version=5.36.2 ;;
          esac
          if [ "${{ runner.os }}" = "macOS" ]; then
            echo "extension=protobuf" >> "$GITHUB_OUTPUT"
          else
            echo "extension=protobuf-$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: posix, json, ${{ steps.protobuf.outputs.extension }}
          coverage: none
        env:
          phpts: ${{ matrix.ts || 'nts' }}

      # run-tests.php of PHP 8 starts PHP with -n, so protobuf has to be loaded by
      # its full path. That path is taken from the ini setup-php wrote: on macOS
      # Homebrew keeps it outside php-config's extension dir.
      - name: Locate ext-protobuf
        run: |
          protobuf=$(php -r '
            $files = array_filter(array_map("trim", array_merge([(string) php_ini_loaded_file()], explode(",", (string) php_ini_scanned_files()))));
            foreach ($files as $file) {
                foreach (file($file) as $line) {
                    if (preg_match("/^\\s*extension\\s*=\\s*\"?([^\"\\s;]*protobuf[^\"\\s;]*)/", $line, $m)) {
                        $path = $m[1];
                        if ($path[0] !== "/") {
                            $path = ini_get("extension_dir")."/".(substr($path, -3) === ".so" ? $path : $path.".so");
                        }
                        echo $path;
                        exit(0);
                    }
                }
            }
            exit(1);
          ')
          echo "PROTOBUF_SO=$protobuf" >> "$GITHUB_ENV"

      # Reproducible version and year: the tag name for a tag build, else
      # extension/VERSION plus the commit; the year of the commit date.
      - name: Build the extension
        run: |
          cd extension/
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cat VERSION)+g${GITHUB_SHA::7}"
          fi
          year=$(git log -1 --format=%cd --date=format:%Y)
          phpize
          if [ "${{ matrix.sigqueue }}" = "no" ]; then
            export ac_cv_func_sigqueue=no
          fi
          ./configure --with-meminfo-s3=no --with-meminfo-version="$version" --with-meminfo-copyright-year="$year"
          make
          php -d extension=$PWD/modules/meminfo.so --ri meminfo | grep -E '^(Version|Copyright)'
          php -r 'echo "Thread safety: ", PHP_ZTS ? "ZTS" : "NTS", "\n";'

      # On macOS sigqueue() is absent by itself; the check proves the kill path is the one tested.
      - name: Check that sigqueue() is disabled
        if: matrix.sigqueue == 'no' || runner.os == 'macOS'
        run: |
          ! grep -q '^#define HAVE_SIGQUEUE' extension/config.h

      # run-tests.php from PHP 7 does not pick up the freshly built module on its
      # own, so the extension is passed explicitly; it does read php.ini, which
      # already loads protobuf. make test works on PHP 8.
      - name: Test the extension (PHP 7)
        if: startsWith(matrix.php-versions, '7.')
        shell: bash
        run: |
          cd extension/
          REPORT_EXIT_STATUS=1 NO_INTERACTION=1 TEST_PHP_EXECUTABLE=$(which php) $(which php) run-tests.php -d extension=$PWD/modules/meminfo.so | tee run-tests.log

      - name: Test the extension (PHP 8)
        if: startsWith(matrix.php-versions, '8.')
        shell: bash
        run: |
          cd extension/
          REPORT_EXIT_STATUS=1 NO_INTERACTION=1 make test TESTS="-d extension=$PROTOBUF_SO tests/" | tee run-tests.log

      # A protobuf.so that fails to load makes the test skip, not fail.
      - name: Check that the protobuf test ran
        run: |
          grep -E '(PASS|FAIL).*bug-protobuf_null_properties' extension/run-tests.log

      # The process tests run cli/bin/dump-meminfo and skip when it is missing, so
      # a wrong path would pass unnoticed. Their target side needs PHP 7.1+ and NTS.
      - name: Check that the dump-meminfo tests ran
        if: matrix.php-versions != '7.0' && matrix.ts != 'zts'
        run: |
          grep -E '(PASS|FAIL).*tests/dump-signal_process\.phpt' extension/run-tests.log
          grep -E '(PASS|FAIL).*tests/dump-signal_process_dir\.phpt' extension/run-tests.log
          grep -E '(PASS|FAIL).*tests/dump-signal_process_series\.phpt' extension/run-tests.log

      - name: Diagnose failed extension tests
        if: failure()
        run: bash tools/ci/diagnose-extension-tests.sh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ext-tests-output-${{ matrix.os }}-php-${{ matrix.php-versions }}-${{ matrix.ts || 'nts' }}-sigqueue-${{ matrix.sigqueue }}
          path: |
            extension/tests/*.out
            extension/tests/*.diff
            extension/tests/*.exp
            extension/tests/*.log
            extension/run-tests.log
            extension/config.log
            extension/test-diagnostics/

  # ext-swoole, so the Swoole tests run instead of skipping, plus the coroutine
  # scenarios of tools/repro/swoole (dumps from inside a coroutine, 10 000
  # suspended coroutines, dump-meminfo on a coroutine loop). Built in the same
  # image as `make repro-swoole` locally.
  swoole:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.1', '8.3', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # An explicit shell turns on pipefail, so a failing test still fails the step.
      - name: Test the extension with ext-swoole loaded
        shell: bash
        run: make repro-swoole-test PHP_VERSION=${{ matrix.php-versions }} | tee run-tests.log

      # A swoole.so that fails to load makes these tests skip, not fail.
      - name: Check that the Swoole tests ran
        run: |
          grep -E '(PASS|FAIL).*dump-swoole_coroutine' run-tests.log
          grep -E '(PASS|FAIL).*dump-swoole_suspended_coroutines' run-tests.log

      - name: Run the Swoole scenarios
        run: make repro-swoole PHP_VERSION=${{ matrix.php-versions }}

  # The S3 transport (--with-meminfo-s3): aws-c-s3 from vcpkg at the baseline
  # of extension/deps/vcpkg.json, the .phpt suite against a throwaway S3-compatible server
  # (versitygw; MinIO no longer publishes images), with the dump-s3_* tests
  # required to run. One entry without sigqueue() exercises the trigger's
  # kill() path with upload records; macOS only checks that it builds and
  # links (frameworks instead of s2n/OpenSSL symbols hiding).
  s3:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['7.4', '8.1', '8.4']
        sigqueue: ['yes']
        os: ['ubuntu-22.04']
        include:
          - php-versions: '8.1'
            sigqueue: 'no'
            os: 'ubuntu-22.04'
          - php-versions: '8.4'
            sigqueue: 'yes'
            os: 'macos-latest'
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/../vcpkg-cache
      S3_GATEWAY_IMAGE: versity/versitygw:v1.10.0
      AWS_ACCESS_KEY_ID: meminfo-test
      AWS_SECRET_ACCESS_KEY: meminfo-test-secret
      AWS_REGION: us-east-1
      MEMINFO_TEST_KEEP_CHILD_OUTPUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: posix, json, pcntl
          coverage: none

      - name: Check out vcpkg at the baseline of extension/deps/vcpkg.json
        run: |
          baseline=$(php -r 'echo json_decode(file_get_contents("extension/deps/vcpkg.json"), true)["builtin-baseline"];')
          git init -q "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch -q --depth 1 https://github.com/microsoft/vcpkg.git "$baseline"
          git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('extension/deps/vcpkg.json') }}

      - name: Install aws-c-s3 with vcpkg
        run: make vcpkg-install VCPKG_ROOT="$VCPKG_ROOT"

      - name: Build the extension with S3
        run: |
          prefix=$(ls -d "$PWD"/vcpkg_installed/*-linux "$PWD"/vcpkg_installed/*-osx 2>/dev/null | head -1)
          echo "MEMINFO_S3=$prefix" >> "$GITHUB_ENV"
          cd extension/
          phpize
          if [ "${{ matrix.sigqueue }}" = "no" ]; then
            export ac_cv_func_sigqueue=no
          fi
          ./configure --with-meminfo-s3="$prefix"
          make
          php -d extension=$PWD/modules/meminfo.so --ri meminfo | grep -E '^(Version|S3 transport)'
          php -d extension=$PWD/modules/meminfo.so --ri meminfo | grep -q '^S3 transport => yes'

      # aws-c-s3 brings s2n and its own OpenSSL on Linux; none of it may be
      # visible to the rest of the process (ext/openssl, ext/curl).
      - name: Check that no CRT or OpenSSL symbol is exported
        if: runner.os == 'Linux'
        run: |
          exported=$(nm -D --defined-only extension/modules/meminfo.so | awk '{print $3}')
          echo "$exported"
          if echo "$exported" | grep -qiE '^(SSL_|EVP_|OPENSSL|CRYPTO_|s2n_|aws_)'; then
            echo "::error::meminfo.so exports CRT or OpenSSL symbols"
            exit 1
          fi

      - name: Start the S3 server
        if: runner.os == 'Linux'
        run: |
          docker run -d --name s3gw -p 7070:7070 \
            -e ROOT_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" -e ROOT_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            --entrypoint sh "$S3_GATEWAY_IMAGE" -c 'mkdir -p /data && exec versitygw --port :7070 posix /data'
          for i in $(seq 1 50); do php -r 'exit(@fsockopen("127.0.0.1", 7070) ? 0 : 1);' && break; sleep 0.2; done
          echo "MEMINFO_TEST_S3_ENDPOINT=http://127.0.0.1:7070" >> "$GITHUB_ENV"

      - name: Test the extension (PHP 7)
        if: runner.os == 'Linux' && startsWith(matrix.php-versions, '7.')
        shell: bash
        run: |
          cd extension/
          REPORT_EXIT_STATUS=1 NO_INTERACTION=1 TEST_PHP_EXECUTABLE=$(which php) $(which php) run-tests.php -d extension=$PWD/modules/meminfo.so | tee run-tests.log

      - name: Test the extension (PHP 8)
        if: runner.os == 'Linux' && startsWith(matrix.php-versions, '8.')
        shell: bash
        run: |
          cd extension/
          REPORT_EXIT_STATUS=1 NO_INTERACTION=1 make test TESTS="tests/" | tee run-tests.log

      # Without a server or an S3 build these tests skip, which would pass
      # unnoticed.
      - name: Check that the S3 tests ran
        if: runner.os == 'Linux'
        run: |
          for test in signal on_limit failure no_wait process keep_local fork ini; do
            grep -E "PASS.*tests/dump-s3_$test\.phpt" extension/run-tests.log
          done

      - name: Check that sigqueue() is disabled
        if: matrix.sigqueue == 'no'
        run: |
          ! grep -q '^#define HAVE_SIGQUEUE' extension/config.h

      - name: Diagnose failed S3 tests
        if: failure()
        run: |
          bash tools/ci/diagnose-extension-tests.sh
          if [ "${{ runner.os }}" = "Linux" ]; then
            docker logs s3gw > extension/test-diagnostics/s3-server.log 2>&1 || true
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: s3-tests-output-${{ matrix.os }}-php-${{ matrix.php-versions }}-sigqueue-${{ matrix.sigqueue }}
          path: |
            extension/tests/*.out
            extension/tests/*.diff
            extension/tests/*.exp
            extension/tests/*.log
            extension/run-tests.log
            extension/config.log
            extension/test-diagnostics/

  # How fast meminfo_dump() writes a ~2M-item graph (tools/bench/), against
  # master for a branch and against the previous commit on master. Both builds
  # run interleaved on the same runner; the job fails above 20% slower — two
  # identical builds already differ by up to 10% on a shared machine.
  bench:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Pick the baseline
        run: |
          if [ "$GITHUB_REF_NAME" = "master" ]; then
            echo "BENCH_BASE=HEAD^" >> "$GITHUB_ENV"
          else
            echo "BENCH_BASE=origin/master" >> "$GITHUB_ENV"
          fi

      - name: Compare dump speed with the baseline
        run: make bench-compare BENCH_BASE="$BENCH_BASE" BENCH_RUNS=7 BENCH_THRESHOLD=20 BENCH_ROUNDS=3

  # The two Composer packages as their users get them: vanta/meminfo built by
  # PIE from the release archive (git archive, trimmed by .gitattributes), and
  # vanta/dump-meminfo installed by Composer, run through vendor/bin.
  packages:
    runs-on: ubuntu-22.04
    env:
      PIE_VERSION: 1.5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner context is not available in a job's env.
      - name: Set up the work directories
        run: |
          echo "DIST_DIR=$RUNNER_TEMP/meminfo-dist" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$RUNNER_TEMP/cli-project" >> "$GITHUB_ENV"
          echo "DUMP_DIR=$RUNNER_TEMP/dumps" >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: posix, json, zip
          tools: composer:v2
          coverage: none

      - name: Validate composer.json files
        run: |
          composer validate --strict composer.json
          composer validate --strict cli/composer.json

      - name: Install PIE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -o pie.phar "https://github.com/php/pie/releases/download/${PIE_VERSION}/pie.phar"
          gh attestation verify --owner php pie.phar
          sudo install -m 0755 pie.phar /usr/local/bin/pie
          rm pie.phar
          pie --version

      - name: Unpack the release archive
        run: |
          mkdir -p "$DIST_DIR"
          git archive --format=tar HEAD | tar -x -C "$DIST_DIR"
          echo "Archive content:"
          find "$DIST_DIR" -maxdepth 2 | sort

      # As root: PIE writes into the system extension and ini directories and
      # refuses to call sudo itself without an interactive terminal. The path
      # repository goes into root's PIE config too, or install would not see it.
      - name: Install native build tools for the default S3 build
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config linux-libc-dev git curl zip unzip tar perl g++

      - name: Install the extension with PIE
        run: |
          sudo pie repository:add path "$DIST_DIR"
          sudo pie install --no-interaction --with-php-config="$(command -v php-config)" 'vanta/meminfo:*@dev'
          php --ri meminfo | grep -E '^(Version|Copyright)'
          php -m | grep -qx meminfo

      - name: Install vanta/dump-meminfo with Composer
        run: |
          mkdir -p "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          composer init --no-interaction --name=ci/project --stability=dev
          composer config repositories.dump-meminfo '{"type": "path", "url": "${{ github.workspace }}/cli", "options": {"symlink": false}}'
          composer require --no-interaction 'vanta/dump-meminfo:*@dev'
          composer show vanta/dump-meminfo
          vendor/bin/dump-meminfo --help

      - name: Dump a running process with vendor/bin/dump-meminfo
        run: |
          mkdir -p "$DUMP_DIR"
          php -r '$deadline = microtime(true) + 60; while (microtime(true) < $deadline) { for ($i = 0; $i < 100000; $i++) {} }' &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 1
          echo "Target pid: $pid"
          file=$("$PROJECT_DIR/vendor/bin/dump-meminfo" "$pid" --dir="$DUMP_DIR" --timeout=20)
          echo "Dump written to: $file"
          ls -l "$file"
          php -r '$dump = json_decode(file_get_contents($argv[1]), true); if (!isset($dump["header"], $dump["items"])) { fwrite(STDERR, "not a meminfo dump\n"); exit(1); } echo count($dump["items"]), " items\n";' "$file"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: packages-output
          path: |
            ${{ runner.temp }}/dumps
            ${{ runner.temp }}/cli-project/composer.json
